x-worker: &worker
  build:
    context: .
    dockerfile: Dockerfile.worker
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=1)"]
    interval: 2s
    timeout: 2s
    retries: 5
services:
  worker1: *worker
  worker2: *worker
  worker3: *worker
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports: ["127.0.0.1:8080:8080"]
    environment:
      BACKEND: onnx
      WORKER_URLS: http://worker1:9000,http://worker2:9000,http://worker3:9000
      POLICY: ${POLICY:-round-robin}
      MAX_IN_FLIGHT: "6"
      QUEUE_CAPACITY: "12"
    depends_on:
      worker1: {condition: service_healthy}
      worker2: {condition: service_healthy}
      worker3: {condition: service_healthy}
